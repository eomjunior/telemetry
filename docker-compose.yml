version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# VideoToBook — Telemetry Stack
#
# Starts Prometheus + Grafana pre-wired to your running app.
#
# Usage (from the repo root):
#   docker compose -f telemetry/docker-compose.yml up -d
#
# Then open http://localhost:3001 (Grafana, admin / admin)
# ─────────────────────────────────────────────────────────────────────────────

services:

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: vtb_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:10.4.2
    container_name: vtb_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - telemetry

volumes:
  prometheus_data:
  grafana_data:

networks:
  telemetry:
    driver: bridge
