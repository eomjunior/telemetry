apiVersion: 1

datasources:

  # ── Prometheus ──────────────────────────────────────────────────────────────
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  # ── Elasticsearch (business events / telemetry) ──────────────────────────────
  # Fill in ELASTICSEARCH_URL and credentials that match your deployment.
  # If running in EasyPanel, use the internal service hostname.
  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: ${ELASTICSEARCH_URL:-http://apps_elasticsearch:9200}
    editable: false
    jsonData:
      index: videotobook-index
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: event
      logLevelField: environment
    secureJsonData:
      basicAuth: false
